[pytest]
# docs/HARNESS.md section 1 fixes the channel module names, and none of them
# match pytest's default discovery glob. Naming them test_*.py instead would
# put the harness structure at odds with the contract that specifies it.
python_files = oracle.py chunking.py pool.py resource.py test_*.py
python_classes = Test*
python_functions = test_*

# docs/HARNESS.md section 8 sets a 30 s per case timeout. Enforcing it
# declaratively needs pytest-timeout, which is not a pinned dependency and is
# installed with the image at build time; until then no per case timeout is
# applied and the bound is the verifier's own. Recorded rather than assumed.

testpaths = channels
addopts = -ra --strict-markers
markers =
    channel(name): which scoring channel a case belongs to
