[pytest]
# docs/HARNESS.md section 1 fixes the channel module names, and none of them
# match pytest's default discovery glob. Naming them test_*.py instead would
# put the harness structure at odds with the contract that specifies it.
python_files = oracle.py chunking.py pool.py caching.py resource.py test_*.py
python_classes = Test*
python_functions = test_*

# docs/HARNESS.md section 8 sets a 30 s per case bound. It is enforced by
# pytest-timeout, pinned at 2.4.0 and installed into the harness interpreter at
# image build time. On a development machine without the plugin this setting is
# inert and the only limit is whatever runs the suite, which is why the image
# installs it rather than leaving the bound documentary.
timeout = 30

testpaths = channels
addopts = -ra --strict-markers
markers =
    channel(name): which scoring channel a case belongs to
